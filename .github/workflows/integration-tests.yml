name: Integration Tests

on:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration Tests with Docker Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragdb
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raguser -d ragdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.9.3
        ports:
          - 6333:6333
          - 6334:6334

    env:
      DATABASE_URL: postgresql+asyncpg://raguser:ragpassword@localhost:5432/ragdb
      REDIS_URL: redis://localhost:6379/0
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Init pgvector schema
        run: |
          PGPASSWORD=ragpassword psql -h localhost -U raguser -d ragdb \
            -f infra/init-pgvector.sql

      - name: Run integration tests
        run: |
          uv run pytest shared/tests/integration/ \
            pipelines/fastest_rag/tests/integration/ \
            pipelines/multimodal_rag/tests/integration/ \
            -v --tb=short -m integration
