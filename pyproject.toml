[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-research-platform"
version = "0.1.0"
description = "RAG Research Platform — unified monorepo for five RAG pipeline strategies"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "shared",
    "pipelines/fastest_rag",
    "pipelines/multimodal_rag",
    "pipelines/corrective_rag",
    "pipelines/self_rag",
    "pipelines/video_rag",
    "api",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres,redis]>=4.7",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["shared/tests"]
addopts = "--cov=shared/src --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
