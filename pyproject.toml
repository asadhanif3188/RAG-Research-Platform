[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-research-platform"
version = "0.1.0"
description = "RAG Research Platform — unified monorepo for five RAG pipeline strategies"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastest-rag",
    "multimodal-rag",
    "api",
]

[tool.hatch.build.targets.wheel]
packages = []  # Workspace root — no packages to build

[tool.uv.sources]
shared = { workspace = true }
fastest-rag = { workspace = true }
multimodal-rag = { workspace = true }
api = { workspace = true }

[tool.uv.workspace]
members = [
    "shared",
    "pipelines/fastest_rag",
    "pipelines/multimodal_rag",
    "api",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres,redis]>=4.7",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "shared/tests",
    "pipelines/fastest_rag/tests",
    "pipelines/multimodal_rag/tests",
]
addopts = "--cov=shared/src --cov=pipelines/fastest_rag/src --cov=pipelines/multimodal_rag/src --cov-report=term-missing"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require Docker services)",
]

# Ruff config in ruff.toml, mypy config in mypy.ini
