[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared"
version = "0.1.0"
description = "Shared infrastructure package for RAG Research Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langfuse>=2.0",
    "pgvector>=0.3",
    "sqlalchemy[asyncio]>=2.0",
    "redis[hiredis]>=5.0",
    "neo4j>=5.0",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "openai>=1.40",
    "anthropic>=0.34",
    "ragas>=0.2",
    "tavily-python>=0.3",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "tiktoken>=0.7",
    "tenacity>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
