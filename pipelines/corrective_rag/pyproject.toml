[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corrective-rag"
version = "0.1.0"
description = "Corrective RAG (CRAG) — self-assessing retrieval with relevance grading, document decomposition, and web search fallback"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "anthropic>=0.34",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "tavily-python>=0.3",
    "langfuse>=2.0",
    "numpy>=1.26",
    "streamlit>=1.36",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/corrective_rag"]
