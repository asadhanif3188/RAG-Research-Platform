[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Multimodal RAG pipeline — vision model integration, table extraction, provenance tracking"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastest-rag",
    "anthropic>=0.34",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_rag"]
