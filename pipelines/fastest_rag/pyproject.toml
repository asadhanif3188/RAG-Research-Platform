[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastest-rag"
version = "0.1.0"
description = "Fastest RAG Stack — baseline naive RAG + binary quantization + semantic cache"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "anthropic>=0.34",
    "langchain-anthropic>=0.3",
    "qdrant-client>=1.9",
    "numpy>=1.26",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fastest_rag"]
