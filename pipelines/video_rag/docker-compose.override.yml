# Docker Compose override for Video RAG pipeline
# Usage: docker compose -f docker-compose.yml -f pipelines/video_rag/docker-compose.override.yml up

services:
  video-rag:
    build:
      context: ../..
      dockerfile: pipelines/video_rag/Dockerfile
    ports:
      - "8100:8100"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://raguser:ragpassword@postgres:5432/ragdb
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
    depends_on:
      - postgres
      - neo4j
    volumes:
      - video-cache:/tmp/video-cache

volumes:
  video-cache:
